<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detail Dosen - PNL</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f3fa;
            color: #25223a;
        }

        .header {
            background: linear-gradient(135deg, #5b21b6, #9333ea);
            color: white;
            padding: 28px 20px;
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            font-size: 42px;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 30px;
        }

        .logo-area p {
            margin: 5px 0 0;
            font-size: 16px;
        }

        .update-box {
            background: rgba(255,255,255,0.15);
            padding: 14px 20px;
            border-radius: 12px;
            text-align: right;
        }

        .update-box span {
            display: block;
            font-size: 13px;
            opacity: 0.9;
        }

        .update-box strong {
            display: block;
            margin-top: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: #6d28d9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back:hover {
            background: #5b21b6;
        }

        .profile-card,
        .section-card {
            background: white;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(70, 40, 120, 0.08);
        }

        .profile-title {
            color: #5b21b6;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 27px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .profile-item {
            border: 1px solid #e6e1f0;
            border-radius: 10px;
            padding: 15px;
            background: #faf9fd;
        }

        .profile-item .label {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .profile-item .value {
            font-size: 16px;
            font-weight: bold;
            color: #29233e;
        }

        .section-title {
            color: #5b21b6;
            margin-top: 0;
            padding-bottom: 12px;
            border-bottom: 3px solid #7c3aed;
        }

        .item {
            padding: 16px;
            margin-top: 12px;
            border-left: 4px solid #7c3aed;
            background: #faf9fd;
            border-radius: 8px;
        }

        .item-title {
            font-weight: bold;
            line-height: 1.5;
            color: #302548;
        }

        .item-year {
            margin-top: 7px;
            color: #6d28d9;
            font-size: 14px;
            font-weight: bold;
        }

        .item-source {
            margin-top: 5px;
            font-size: 12px;
            color: #777;
        }

        .empty {
            padding: 18px;
            background: #f7f5fb;
            border-radius: 8px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6d28d9;
            font-weight: bold;
        }

        .error {
            background: #fff0f0;
            color: #b42318;
            padding: 20px;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 700px) {

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            .update-box {
                text-align: left;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .logo-area h1 {
                font-size: 24px;
            }

        }

    </style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo-area">

            <div class="logo-icon">
                👥
            </div>

            <div>

                <h1>DATA DOSEN</h1>

                <p>
                    Politeknik Negeri Lhokseumawe
                </p>

            </div>

        </div>

        <div class="update-box">

            <span>
                Informasi
            </span>

            <strong>
                Detail Dosen PNL
            </strong>

        </div>

    </div>

</header>


<main class="container">

    <a href="index.html" class="back">
        ← Kembali ke Daftar Dosen
    </a>


    <div id="isi">

        <div class="loading">
            Memuat data dosen...
        </div>

    </div>

</main>


<footer>

    © 2026 Data Dosen Politeknik Negeri Lhokseumawe

</footer>


<script>

let semuaDosen = [];


/* ESCAPE HTML */
function escapeHtml(text) {

    return String(text ?? "-")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* AMBIL PARAMETER URL */
const params = new URLSearchParams(
    window.location.search
);

const id = params.get("id");
const nidn = params.get("nidn");


/* MEMUAT DATA */
async function ambilData() {

    try {

        const response = await fetch("data.json");

        if (!response.ok) {
            throw new Error("data.json tidak ditemukan");
        }

        const database = await response.json();

        /*
         * data.json sekarang berbentuk array langsung.
         */
        semuaDosen = Array.isArray(database)
            ? database
            : (database.dosen || []);


        console.log(
            "Jumlah dosen:",
            semuaDosen.length
        );


        cariDosen();


    } catch (error) {

        console.error(error);

        document.getElementById("isi").innerHTML = `

            <div class="error">

                <h2>
                    Data gagal dimuat
                </h2>

                <p>
                    File data.json tidak dapat dibaca.
                </p>

            </div>

        `;

    }

}


/* CARI DOSEN */
function cariDosen() {

    let dosen = null;


    /* Cari berdasarkan ID */

    if (id) {

        dosen = semuaDosen.find(
            item => String(item.id) === String(id)
        );

    }


    /* Jika belum ditemukan, cari berdasarkan NIDN */

    if (!dosen && nidn) {

        dosen = semuaDosen.find(
            item => String(item.nidn) === String(nidn)
        );

    }


    if (!dosen) {

        document.getElementById("isi").innerHTML = `

            <div class="error">

                <h2>
                    Data dosen tidak ditemukan
                </h2>

                <p>
                    ID atau NIDN dosen tidak ditemukan dalam data.
                </p>

            </div>

        `;

        return;

    }


    tampilkanDosen(dosen);

}


/* TAMPILKAN DETAIL DOSEN */
function tampilkanDosen(dosen) {

    document.title =
        "Detail " +
        (dosen.nama || "Dosen") +
        " - PNL";


    document.getElementById("isi").innerHTML = `

        <section class="profile-card">

            <h2 class="profile-title">
                ${escapeHtml(dosen.nama)}
            </h2>


            <div class="profile-grid">

                ${profilItem(
                    "Nama",
                    dosen.nama
                )}

                ${profilItem(
                    "NIDN",
                    dosen.nidn
                )}

                ${profilItem(
                    "Perguruan Tinggi",
                    dosen.perguruan_tinggi
                )}

                ${profilItem(
                    "Program Studi",
                    dosen.prodi
                )}

                ${profilItem(
                    "Jurusan",
                    dosen.jurusan
                )}

                ${profilItem(
                    "Jabatan Fungsional",
                    dosen.jabatan_fungsional
                )}

                ${profilItem(
                    "Pendidikan",
                    dosen.pendidikan_terakhir
                )}

                ${profilItem(
                    "Status Kepegawaian",
                    dosen.status_kepegawaian
                )}

                ${profilItem(
                    "Status Aktivitas",
                    dosen.status_aktivitas
                )}

                ${profilItem(
                    "Ikatan Kerja",
                    dosen.ikatan_kerja
                )}

            </div>

        </section>


        ${buatSection(
            "PENELITIAN",
            dosen.penelitian,
            "Belum ada data penelitian."
        )}


        ${buatSection(
            "PENGABDIAN MASYARAKAT",
            dosen.pengabdian,
            "Belum ada data pengabdian masyarakat."
        )}


        ${buatSection(
            "PUBLIKASI KARYA",
            dosen.publikasi,
            "Belum ada data publikasi."
        )}


        ${buatSection(
            "HKI / PATEN",
            dosen.paten,
            "Belum ada data HKI / Paten."
        )}

    `;

}


/* ITEM PROFIL */
function profilItem(label, value) {

    return `

        <div class="profile-item">

            <div class="label">
                ${escapeHtml(label)}
            </div>

            <div class="value">
                ${escapeHtml(value || "-")}
            </div>

        </div>

    `;

}


/* BUAT SECTION */
function buatSection(
    judul,
    data,
    pesanKosong
) {

    let isi = "";


    if (
        !Array.isArray(data) ||
        data.length === 0
    ) {

        isi = `

            <div class="empty">
                ${escapeHtml(pesanKosong)}
            </div>

        `;

    } else {

        isi = data.map(
            (item, index) => {

                const judulItem =
                    item.judul ||
                    item.title ||
                    item.nama ||
                    "Data tidak tersedia";


                const tahun =
                    item.tahun ||
                    item.year ||
                    "";


                const sumber =
                    item.sumber ||
                    "";


                return `

                    <div class="item">

                        <div class="item-title">

                            ${index + 1}.
                            ${escapeHtml(judulItem)}

                        </div>


                        ${
                            tahun
                            ? `
                                <div class="item-year">
                                    Tahun: ${escapeHtml(tahun)}
                                </div>
                              `
                            : ""
                        }


                        ${
                            sumber
                            ? `
                                <div class="item-source">
                                    Sumber: ${escapeHtml(sumber)}
                                </div>
                              `
                            : ""
                        }

                    </div>

                `;

            }
        ).join("");

    }


    return `

        <section class="section-card">

            <h2 class="section-title">
                ${escapeHtml(judul)}
            </h2>

            ${isi}

        </section>

    `;

}


/* JALANKAN */
ambilData();

</script>

</body>
</html>
