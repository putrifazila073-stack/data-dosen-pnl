<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Dosen Politeknik Negeri Lhokseumawe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="header-inner">

            <div class="logo-area">
                <div class="logo-icon">👥</div>

                <div>
                    <h1>DATA DOSEN</h1>
                    <p>Politeknik Negeri Lhokseumawe</p>
                </div>
            </div>

            <div class="update-box">
                <span>Terakhir diperbarui</span>
                <strong>Data Dosen PNL</strong>
            </div>

        </div>
    </header>


    <main class="container">

        <section class="title-box">

            <h2>Daftar Dosen</h2>

            <p>
                Portal Informasi Dosen Politeknik Negeri Lhokseumawe
            </p>

        </section>


        <section class="filter-box">

            <label for="prodi">
                Pilih Program Studi
            </label>

            <select id="prodi">
                <option value="">-- Semua Program Studi --</option>
            </select>

        </section>


        <section class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Cari nama dosen atau NIDN..."
            >

            <button onclick="cariDosen()">
                CARI
            </button>

        </section>


        <section class="table-card">

            <div class="table-header">

                <div>
                    <h2 id="judulData">
                        Semua Program Studi
                    </h2>
                </div>

                <div class="jumlah">
                    <span id="jumlahDosen">0</span>
                    Dosen
                </div>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>NO</th>
                            <th>NAMA DOSEN</th>
                            <th>NIDN</th>
                            <th>PENDIDIKAN</th>
                            <th>STATUS AKTIF</th>
                            <th>PROGRAM STUDI</th>
                        </tr>

                    </thead>

                    <tbody id="tabelDosen">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <footer>
        <p>
            © 2026 Data Dosen Politeknik Negeri Lhokseumawe
        </p>
    </footer>


<script>

let semuaDosen = [];


/* =========================
   AMBIL DATA DARI data.json
========================= */

async function ambilData() {

    try {

        const response = await fetch("data.json");

        const database = await response.json();

        semuaDosen = database.dosen || [];

        isiPilihanProdi();

        tampilkanDosen(semuaDosen);

    } catch (error) {

        console.error(error);

        document.getElementById("tabelDosen").innerHTML = `
            <tr>
                <td colspan="6" class="kosong">
                    Data dosen gagal dimuat.
                </td>
            </tr>
        `;

    }

}


/* =========================
   PILIHAN PROGRAM STUDI
========================= */

function isiPilihanProdi() {

    const select = document.getElementById("prodi");

    const daftarProdi = [
        ...new Set(
            semuaDosen
                .map(dosen => dosen.prodi)
                .filter(prodi => prodi && prodi !== "-")
        )
    ].sort();

    daftarProdi.forEach(prodi => {

        const option = document.createElement("option");

        option.value = prodi;

        option.textContent = prodi;

        select.appendChild(option);

    });

}


/* =========================
   TAMPILKAN DOSEN
========================= */

function tampilkanDosen(data) {

    const tbody = document.getElementById("tabelDosen");

    const jumlah = document.getElementById("jumlahDosen");

    tbody.innerHTML = "";

    jumlah.textContent = data.length;


    if (data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="kosong">
                    Data dosen tidak ditemukan.
                </td>
            </tr>
        `;

        return;
    }


    data.forEach((dosen, index) => {

        const tr = document.createElement("tr");

        tr.innerHTML = `

            <td>${index + 1}</td>

            <td>
                <a
                    class="nama-dosen"
                    href="detail.html?id=${encodeURIComponent(dosen.id)}&nidn=${encodeURIComponent(dosen.nidn || "")}"
                >
                    ${escapeHtml(dosen.nama || "Data tidak tersedia")}
                </a>
            </td>

            <td>
                ${escapeHtml(dosen.nidn || "-")}
            </td>

            <td>
                ${escapeHtml(dosen.pendidikan_terakhir || "-")}
            </td>

            <td>

                <span class="status">
                    ${escapeHtml(dosen.status_aktivitas || "Aktif")}
                </span>

            </td>

            <td>
                ${escapeHtml(dosen.prodi || "-")}
            </td>

        `;

        tbody.appendChild(tr);

    });

}


/* =========================
   FILTER PRODI
========================= */

document.getElementById("prodi").addEventListener(
    "change",
    function () {

        const prodiDipilih = this.value;

        const keyword =
            document
                .getElementById("search")
                .value
                .toLowerCase()
                .trim();


        let hasil = semuaDosen;


        if (prodiDipilih) {

            hasil = hasil.filter(dosen =>
                String(dosen.prodi || "")
                    .toLowerCase() ===
                prodiDipilih.toLowerCase()
            );

        }


        if (keyword) {

            hasil = hasil.filter(dosen =>

                String(dosen.nama || "")
                    .toLowerCase()
                    .includes(keyword)

                ||

                String(dosen.nidn || "")
                    .toLowerCase()
                    .includes(keyword)

            );

        }


        document.getElementById("judulData").textContent =
            prodiDipilih || "Semua Program Studi";


        tampilkanDosen(hasil);

    }
);


/* =========================
   PENCARIAN
========================= */

function cariDosen() {

    const keyword =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    const prodiDipilih =
        document.getElementById("prodi").value;


    let hasil = semuaDosen;


    if (prodiDipilih) {

        hasil = hasil.filter(dosen =>
            String(dosen.prodi || "")
                .toLowerCase() ===
            prodiDipilih.toLowerCase()
        );

    }


    if (keyword) {

        hasil = hasil.filter(dosen =>

            String(dosen.nama || "")
                .toLowerCase()
                .includes(keyword)

            ||

            String(dosen.nidn || "")
                .toLowerCase()
                .includes(keyword)

        );

    }


    tampilkanDosen(hasil);

}


/* ENTER UNTUK MENCARI */

document.getElementById("search").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            cariDosen();

        }

    }
);


/* =========================
   AMANKAN TEKS
========================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* JALANKAN */

ambilData();

</script>

</body>
</html>
