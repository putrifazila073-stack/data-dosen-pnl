<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Dosen Politeknik Negeri Lhokseumawe</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .logo-pnl {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 6px;
            box-sizing: border-box;
            display: block;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-area h1 {
            margin: 0;
        }

        .logo-area p {
            margin: 4px 0 0;
        }

        @media (max-width: 600px) {
            .logo-pnl {
                width: 55px;
                height: 55px;
            }

            .logo-area {
                gap: 10px;
            }

            .logo-area h1 {
                font-size: 20px;
            }

            .logo-area p {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-inner">

            <div class="logo-area">

                <img
                    src="Logo.pnl.png.png"
                    alt="Logo Politeknik Negeri Lhokseumawe"
                    class="logo-pnl"
                >

                <div>
                    <h1>DATA DOSEN</h1>
                    <p>Politeknik Negeri Lhokseumawe</p>
                </div>

            </div>

            <div class="update-box">
                <span>Terakhir diperbarui</span>
                <strong>Data Dosen PNL</strong>
            </div>

        </div>
    </header>

    <main class="container">

        <section class="title-box">

            <h2>Daftar Dosen</h2>

            <p>
                Portal Informasi Dosen Politeknik Negeri Lhokseumawe
            </p>

        </section>

        <section class="filter-box">

            <label for="prodi">
                Pilih Program Studi
            </label>

            <select id="prodi">
                <option value="">-- Semua Program Studi --</option>
            </select>

        </section>

        <section class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Cari nama dosen atau NIDN..."
            >

            <button onclick="cariDosen()">
                CARI
            </button>

        </section>

        <section class="table-card">

            <div class="table-header">

                <div>
                    <h2 id="judulData">
                        Semua Program Studi
                    </h2>
                </div>

                <div class="jumlah">
                    <span id="jumlahDosen">0</span>
                    Dosen
                </div>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>NO</th>
                            <th>NAMA DOSEN</th>
                            <th>NIDN</th>
                            <th>PENDIDIKAN</th>
                            <th>STATUS AKTIF</th>
                            <th>PROGRAM STUDI</th>
                        </tr>
                    </thead>

                    <tbody id="tabelDosen">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <footer>
        <p>
            © 2026 Data Dosen Politeknik Negeri Lhokseumawe
        </p>
    </footer>


<script>

let semuaDosen = [];


/* AMBIL DATA */
async function ambilData() {

    try {

        const response = await fetch("data.json");

        if (!response.ok) {
            throw new Error("data.json tidak ditemukan");
        }

        const database = await response.json();

        semuaDosen = Array.isArray(database)
            ? database
            : (database.dosen || []);

        console.log("Jumlah data dosen:", semuaDosen.length);

        isiPilihanProdi();

        tampilkanDosen(semuaDosen);

    } catch (error) {

        console.error("Gagal memuat data:", error);

        document.getElementById("tabelDosen").innerHTML = `
            <tr>
                <td colspan="6" class="kosong">
                    Data dosen gagal dimuat.
                </td>
            </tr>
        `;

    }

}


/* NORMALISASI TEKS */
function normalisasiTeks(teks) {

    return String(teks || "")
        .trim()
        .replace(/\s+/g, " ")
        .toLowerCase();

}


/* PILIHAN PROGRAM STUDI */
function isiPilihanProdi() {

    const select = document.getElementById("prodi");

    const daftarProdi = [
        ...new Set(

            semuaDosen
                .map(dosen => String(dosen.prodi || "").trim())
                .filter(prodi => prodi && prodi !== "-")

        )
    ].sort((a, b) => a.localeCompare(b));


    daftarProdi.forEach(prodi => {

        const option = document.createElement("option");

        option.value = prodi;

        option.textContent = prodi;

        select.appendChild(option);

    });

}


/* TAMPILKAN DATA DOSEN */
function tampilkanDosen(data) {

    const tbody =
        document.getElementById("tabelDosen");

    const jumlah =
        document.getElementById("jumlahDosen");

    tbody.innerHTML = "";

    jumlah.textContent = data.length;


    if (data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="kosong">
                    Data dosen tidak ditemukan.
                </td>
            </tr>
        `;

        return;

    }


    data.forEach((dosen, index) => {

        const tr = document.createElement("tr");

        tr.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>

                <a
                    class="nama-dosen"
                    href="detail.html?id=${encodeURIComponent(dosen.id)}&nidn=${encodeURIComponent(dosen.nidn || "")}"
                >

                    ${escapeHtml(
                        dosen.nama ||
                        "Data tidak tersedia"
                    )}

                </a>

            </td>

            <td>

                ${escapeHtml(
                    dosen.nidn || "-"
                )}

            </td>

            <td>

                ${escapeHtml(
                    dosen.pendidikan_terakhir || "-"
                )}

            </td>

            <td>

                <span class="status">

                    ${escapeHtml(
                        dosen.status_aktivitas ||
                        "Aktif"
                    )}

                </span>

            </td>

            <td>

                ${escapeHtml(
                    dosen.prodi || "-"
                )}

            </td>

        `;

        tbody.appendChild(tr);

    });

}


/* FILTER BERDASARKAN PROGRAM STUDI */
function filterData() {

    const prodiDipilih =
        document.getElementById("prodi").value;

    const keyword =
        document
            .getElementById("search")
            .value
            .trim();

    let hasil = semuaDosen;


    /* FILTER PRODI */
    if (prodiDipilih) {

        const prodiPilihan =
            normalisasiTeks(prodiDipilih);

        hasil = hasil.filter(dosen => {

            const prodiDosen =
                normalisasiTeks(dosen.prodi);

            return prodiDosen === prodiPilihan;

        });

    }


    /* FILTER PENCARIAN */
    if (keyword) {

        const kataKunci =
            normalisasiTeks(keyword);

        hasil = hasil.filter(dosen => {

            const nama =
                normalisasiTeks(dosen.nama);

            const nidn =
                normalisasiTeks(dosen.nidn);

            return (
                nama.includes(kataKunci) ||
                nidn.includes(kataKunci)
            );

        });

    }


    document.getElementById("judulData").textContent =
        prodiDipilih ||
        "Semua Program Studi";

    tampilkanDosen(hasil);

}


/* SAAT PROGRAM STUDI DIPILIH */
document
    .getElementById("prodi")
    .addEventListener(
        "change",
        function() {

            filterData();

        }
    );


/* PENCARIAN */
function cariDosen() {

    filterData();

}


/* ENTER UNTUK MENCARI */
document
    .getElementById("search")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                cariDosen();

            }

        }
    );


/* ESCAPE HTML */
function escapeHtml(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* JALANKAN DATA */
ambilData();

</script>

</body>
</html>
